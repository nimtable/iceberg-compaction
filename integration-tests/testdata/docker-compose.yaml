networks:
  rest_bridge:

services:
  rest:
    image: apache/iceberg-rest-fixture
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_CATALOG__IMPL=org.apache.iceberg.jdbc.JdbcCatalog
      - CATALOG_URI=jdbc:sqlite:file:/tmp/iceberg_rest_mode=memory
      - CATALOG_WAREHOUSE=s3://icebergdata/demo
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      # Force path-style access to ensure compatibility with MinIO in docker network
      # Mapping rule: '_' -> '.', '__' -> '-'  => CATALOG_S3_PATH__STYLE__ACCESS => s3.path-style-access
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      # Avoid proxying internal docker network traffic which causes 502 from proxy
      - HTTP_PROXY=
      - http_proxy=
      - HTTPS_PROXY=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1,minio,rest,.minio
      - no_proxy=localhost,127.0.0.1,minio,rest,.minio
    depends_on:
      minio:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    networks:
      rest_bridge:
    ports:
      - "8181:8181"

  minio:
    image: rustfs/rustfs:1.0.0
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
    hostname: minio
    networks:
      rest_bridge:
        aliases:
          - icebergdata.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-buckets:
    depends_on:
      minio:
        condition: service_healthy
    image: rustfs/rustfs:1.0.0
    environment:
      - HTTP_PROXY=
      - http_proxy=
      - HTTPS_PROXY=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1,minio,rest,.minio
      - no_proxy=localhost,127.0.0.1,minio,rest,.minio
    entrypoint: >
      /bin/sh -c "
        curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 -u admin:password -X PUT http://minio:9000/icebergdata
      "
    networks:
      rest_bridge:
